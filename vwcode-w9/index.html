<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mondrian Exhibition</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>

  <body>
    <main class="poster">
      <!-- 빨간색 상단 -->
      <section class="year-panel">
        <p>1911</p>
      </section>
      <!-- 오른쪽 상단 흰색-->
      <section class="blank-panel"></section>
      <!-- 메인 타이틀 -->
      <section class="title-panel">
        <span class="edition-mark">1911</span>
        <div class="title-content">
          <h1>Mondrian</h1>
          <h2>Exhibition</h2>
          <p class="subtitle">
            RED. YELLOW. BLUE.<br />
            LESS IS ABSOLUTE
          </p>
        </div>
      </section>
      <!-- 파란색 타이틀-->
      <section class="blue-panel">
        <h2>Order<br />and<br />Harmony</h2>
      </section>
      <!-- 작품 설명 -->
      <section class="caption-panel">
        <h2>The Geometry of<br />Balance</h2>
      </section>
      <!-- 노란색 전시 정보 -->
      <section class="event-panel">
        <div class="event-content">
          <h2>SEOUL -<br />MUSEUM INFINITY</h2>
          <p>
            202X.XX.XX~<br />
            202X.XX.XX
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
